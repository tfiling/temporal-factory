[project]
name = "temporal-factory"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["temporalio>=1.7", "claude-agent-sdk", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
include = ["factory*"]

[tool.setuptools.package-data]
factory = ["config.json", "prompts/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
