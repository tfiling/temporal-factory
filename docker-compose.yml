#Temporal's example: https://github.com/temporalio/temporal-server-operations/blob/main/compose/docker-compose.yml
services:
  postgres:
    image: postgres:19
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - pg-data:/var/lib/postgresql  # postgres 18+ layout
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  # One-shot: create/upgrade the Temporal schemas (replaces deprecated auto-setup).
  temporal-schema:
    image: temporalio/admin-tools:1.32.2
    restart: on-failure:6
    depends_on:
      postgres: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        T="temporal-sql-tool --plugin postgres12 --ep postgres -p 5432 -u temporal --pw temporal"
        S=/etc/temporal/schema/postgresql/v12
        for db in temporal:temporal temporal_visibility:visibility; do
          name=$${db%%:*}; dir=$${db##*:}
          $$T --db $$name create-database 2>/dev/null || true
          $$T --db $$name setup-schema -v 0.0 2>/dev/null || true
          $$T --db $$name update-schema -d $$S/$$dir/versioned
        done

  temporal:
    image: temporalio/server:1.32.2
    depends_on:
      temporal-schema: { condition: service_completed_successfully }
    environment:
#  postgres12 is the name of Temporal's built-in SQL driver (plugin) for PostgreSQL.
#  It's an identifier in Temporal's code, not a Postgres version.
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgres
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development.yaml
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    ports: ["7233:7233"]
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60

  # One-shot: register the `default` namespace.
  temporal-namespace:
    image: temporalio/admin-tools:1.32.2
    restart: on-failure:5
    depends_on:
      temporal: { condition: service_healthy }
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    entrypoint: ["/bin/sh", "-c"]
    command:
      - temporal operator namespace describe -n default || temporal operator namespace create -n default

  temporal-ui:
    image: temporalio/ui:2.58.1
    depends_on:
      temporal: { condition: service_healthy }
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["8080:8080"]

  worker:
    build:
      context: .
      args:
        FACTORY_VERSION: ${FACTORY_VERSION:-unknown}  # set by scripts/lib.sh
    restart: on-failure
    depends_on:
      temporal-namespace: { condition: service_completed_successfully }
    env_file: .env
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    volumes:
      - factory-data:/data

volumes:
  pg-data:
    name: temporal_factory_pg-data
  factory-data:
